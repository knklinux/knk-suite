name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # node-pty requiere compilar con node-gyp en el runner
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      # better-sqlite3 y node-pty necesitan sus scripts de instalación
      # (prebuild-install / node-gyp) para compilar/descargar binarios nativos.
      # --ignore-scripts rompe require('better-sqlite3') en el CI.
      # npm ci instala exactamente el lockfile (reproducible).
      - name: Install backend deps
        run: npm ci
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Run unit/smoke tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Server smoke test
        run: npm run smoke
      # Backstop de secretos: el hook de pre-commit es local; esto cubre
      # pushes hechos desde clones sin `npm install` (sin hooksPath).
      - name: Secret scan (tree)
        run: node ci/secret-check.mjs --all
      # Backstop de higiene del árbol: la raíz no vuelve a acumular logs de
      # ejecución ni README.txt (README.md es el canónico). Mismo reparto que
      # secret-check: hook local preventivo + backstop de CI.
      - name: Repo hygiene (tree)
        run: node ci/repo-hygiene.mjs --all

  # Segundo escáner independiente: gitleaks con REGLAS DE LA COMUNIDAD y
  # escaneo del HISTORIAL COMPLETO (caza secretos que entraron al repo
  # antes de que existiera el guardián propio). Se complementan:
  # secret-check.mjs = reglas específicas de KNK + pre-commit preventivo;
  # gitleaks = base de datos amplia de patrones + auditoría retroactiva.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: gitleaks detect escanea TODOS los commits.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Token automático del runner: no hace falta crear ninguno.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
