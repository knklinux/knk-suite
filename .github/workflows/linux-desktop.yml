name: Linux desktop build

# Instalador Linux (deb + AppImage) del workbench. Se construye en un runner
# Ubuntu con las dependencias de Tauri; el bundle lleva backend + frontend +
# node_modules compilados para Linux (better-sqlite3 y node-pty nativos).
#
# El job `smoke-deb` instala el .deb resultante en un contenedor ubuntu:22.04
# real (apt resuelve los Depends: webkit2gtk, GTK, appindicator), comprueba el
# layout instalado, arranca el backend INSTALADO con el node EMBEBIDO
# (runtime/node) y afirma:
#   * GET /api/health        → 200 (público)
#   * GET /bootstrap         → 200 + Set-Cookie: knk_token=…
#   * POST /api/targets      → 200 con cookie (regresión del CRUD multi-target)
#   * GET /api/findings      → 401 sin cookie (gate de auth)
#
# Se dispara en pushes que tocan el shell/backend/frontend y manualmente
# (workflow_dispatch) para regenerar instaladores on-demand.

on:
  push:
    branches: [main, master]
    paths:
      - "src-tauri/**"
      - "backend/**"
      - "frontend/src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/linux-desktop.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Rust estable + dependencias del sistema que Tauri exige en Linux
      # (webkit2gtk-4.1 para Tauri 2, plus librerías de GTK/notify).
      # OJO: en Ubuntu 22.04 libappindicator3-dev CONFLICTÚA con la variante
      # ayatana (apt: "Conflicts:") — solo se instala libayatana-appindicator3-dev.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libudev-dev libfuse2 file

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Install backend deps (nativos Linux)
        run: npm ci

      # El bundle Linux (deb/AppImage) requiere node en la máquina destino
      # (node_executable cae al "node" del PATH). Para no exigirlo, se embute
      # el binario oficial de Node en <instalación>/runtime/node — el shell lo
      # prefiere antes que el del sistema (mismo orden que en Windows).
      - name: Embed Node runtime
        run: |
          NODE_VER=v22.23.2
          # el recurso se declara como "../runtime" (relativo a src-tauri):
          # el binario debe vivir en la RAÍZ del repo, no en src-tauri/
          mkdir -p runtime
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /tmp
          cp "/tmp/node-${NODE_VER}-linux-x64/bin/node" runtime/node
          chmod +x runtime/node
          test -x runtime/node
          # tauri.conf.json resources: añadir runtime/ (se hace con un patch jq
          # para no duplicar en cada build)
          jq '.bundle.resources["../runtime"] = "runtime"' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json

      - name: Build Tauri (deb + AppImage)
        run: |
          npm run tauri:build -- --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knklinux-linux-installer
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Smoke del .deb en Ubuntu real: instala el paquete (apt resuelve los Depends
  # del control), valida el layout y lanza el backend instalado con el node
  # embebido para afirmar /api/health, /bootstrap (+cookie knk_token), el CRUD
  # de /api/targets autenticado y el gate 401 sin cookie.
  smoke-deb:
    needs: linux
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: knklinux-linux-installer
          path: dist

      - name: Install the .deb (apt resolves Depends)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ./dist/deb/*.deb

      - name: Assert installed layout
        run: |
          set -e
          test -x /usr/bin/knklinux-desktop
          APP="/usr/lib/knkLinux Security Workbench"
          test -f "$APP/backend/index.js"
          test -f "$APP/backend/routes.js"
          test -f "$APP/frontend/dist/index.html"
          test -x "$APP/runtime/node"
          test -d "$APP/node_modules"
          test -d "$APP/data"
          echo "layout OK en $APP"

      - name: Launch installed backend and assert endpoints
        run: |
          set -e
          APP="/usr/lib/knkLinux Security Workbench"
          KNK_PORT=8099 KNK_DB=/tmp/smoke-suite.db \
            "$APP/runtime/node" "$APP/backend/index.js" > /tmp/backend.log 2>&1 &
          BPID=$!

          # espera a que /api/health conteste (máx 30s)
          up=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/api/health; then up=1; break; fi
            if ! kill -0 $BPID 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then
            echo "::error::el backend instalado no levantó en 30s"
            tail -40 /tmp/backend.log
            exit 1
          fi

          # 1) /api/health público → 200
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/health)
          [ "$code" = 200 ] || { echo "::error::/api/health = $code (esperado 200)"; exit 1; }
          echo "health 200 OK"

          # 2) /bootstrap → 200 + Set-Cookie knk_token
          curl -s -o /dev/null -D /tmp/hdr -c /tmp/jar http://127.0.0.1:8099/bootstrap
          grep -i '^set-cookie: knk_token=' /tmp/hdr > /dev/null \
            || { echo "::error::/bootstrap sin Set-Cookie knk_token"; head -20 /tmp/hdr; exit 1; }
          echo "bootstrap 200 + cookie OK"

          # 3) autenticado con la cookie: CRUD de targets (regresión uuid/db)
          code=$(curl -s -b /tmp/jar -o /tmp/targets.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke","scope":[]}' http://127.0.0.1:8099/api/targets)
          [ "$code" = 200 ] || { echo "::error::POST /api/targets = $code"; cat /tmp/targets.json; exit 1; }
          grep -q '"id"' /tmp/targets.json || { echo "::error::POST /api/targets sin id"; cat /tmp/targets.json; exit 1; }
          echo "targets CRUD 200 OK"

          # 4) gate: sin cookie → 401
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/findings)
          [ "$code" = 401 ] || { echo "::error::/api/findings sin cookie = $code (esperado 401)"; exit 1; }
          echo "gate 401 OK"

      - name: Backend log (on failure)
        if: failure()
        run: tail -60 /tmp/backend.log || true
